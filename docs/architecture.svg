<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#111}rect,path{stroke:#111;stroke-width:1.5;fill:none}.arrow{marker-end:url(#arrow)}.small{font-size:15px}.bold{font-weight:700}</style>
<rect x="15" y="15" width="870" height="410"/><text x="35" y="45" class="bold">lavaneko_core · 端口之外的存储器由集成方提供</text>
